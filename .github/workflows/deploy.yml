name: Deploy a IsardVDI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v3

      - name: Instalar sshpass
        run: sudo apt-get install -y sshpass

      - name: Copiar fitxers al servidor
        run: |
          sshpass -p "${{ secrets.REMOTE_PASS }}" scp -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -r ./* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.REMOTE_USER }}/practica/

      - name: Reiniciar Apache
        run: |
          sshpass -p "${{ secrets.REMOTE_PASS }}" ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo mkdir -p /var/www/html/practica && sudo cp -r /home/${{ secrets.REMOTE_USER }}/practica/* /var/www/html/practica/ && sudo systemctl restart apache2"