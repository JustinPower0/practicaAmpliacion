name: Deploy a IsardVDI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v3

      - name: Configurar clau SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Copiar fitxers al servidor
        run: |
          scp -P 443 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -r ./* d7cc96b5-d30c-430b-9a2f-17373df7f7ec@bastion.elmeuescriptori.cat:/var/www/html/practica/

      - name: Reiniciar Apache
        run: |
          ssh -p 443 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no d7cc96b5-d30c-430b-9a2f-17373df7f7ec@bastion.elmeuescriptori.cat "sudo systemctl restart apache2"